<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRIAM ポイントカウンター 🍇</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f3e8ff;
            background-image: radial-gradient(#c084fc 20%, transparent 20%), radial-gradient(#a855f7 20%, transparent 20%);
            background-size: 24px 24px;
            margin: 0;
            padding: 15px;
            color: #4c1d95;
        }
        .card {
            background: rgba(255, 255, 255, 0.96);
            padding: 18px;
            border-radius: 18px;
            margin-bottom: 15px;
            box-shadow: 0 6px 16px rgba(112, 26, 117, 0.15);
            border: 2px solid #d8b4fe;
        }
        h2 { margin-top: 0; color: #581c87; font-size: 1.1rem; display: flex; justify-content: space-between; align-items: center; }
        
        .total-display {
            text-align: center;
            padding: 16px;
            background: linear-gradient(135deg, #7e22ce, #a855f7);
            color: white;
            border-radius: 14px;
            box-shadow: 0 4px 10px rgba(126, 34, 206, 0.3);
            margin-bottom: 12px;
        }
        .period-title { font-size: 0.85rem; opacity: 0.95; margin-bottom: 4px; }
        .main-points { font-size: 2.2rem; font-weight: bold; }
        .sub-points { font-size: 0.8rem; opacity: 0.85; margin-top: 4px; }

        .progress-box {
            background: #faf5ff;
            border: 1px solid #e9d5ff;
            padding: 10px;
            border-radius: 12px;
            margin-top: 10px;
        }
        .progress-bar-bg {
            background: #e9d5ff;
            height: 14px;
            border-radius: 7px;
            overflow: hidden;
            margin: 6px 0;
        }
        .progress-bar-fill {
            background: linear-gradient(90deg, #a855f7, #ec4899);
            height: 100%;
            width: 0%;
            transition: width 0.4s ease;
        }

        .setting-box {
            background: #faf5ff;
            border: 1px solid #e9d5ff;
            padding: 10px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .setting-box input {
            border: 1px solid #c084fc;
            border-radius: 6px;
            padding: 4px;
            outline: none;
            font-size: 0.85rem;
            width: 110px;
        }

        .daily-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            background: #faf5ff;
            padding: 8px;
            border-radius: 12px;
            border: 1px solid #e9d5ff;
            margin-bottom: 10px;
        }
        .daily-col {
            text-align: center;
            padding: 6px 2px;
            border-radius: 8px;
            cursor: pointer;
            background: white;
            border: 1px solid #f3e8ff;
        }
        .daily-col.today {
            background: #c084fc;
            color: white;
            font-weight: bold;
            border-color: #a855f7;
        }
        .daily-col.selected {
            outline: 2px solid #7e22ce;
            background: #e9d5ff;
        }
        .daily-date { font-size: 0.7rem; margin-bottom: 2px; }
        .daily-val { font-size: 0.72rem; font-weight: bold; word-break: break-all; }

        .active-target-hint {
            font-size: 0.85rem;
            text-align: center;
            color: #6b21a8;
            font-weight: bold;
            margin-bottom: 12px;
            background: #f3e8ff;
            padding: 6px;
            border-radius: 8px;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 10px;
        }
        .btn-pt {
            background: #9333ea;
            color: white;
            border: none;
            padding: 12px 6px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-pt:active { background: #6b21a8; transform: scale(0.96); }
        .btn-max { grid-column: span 2; background: #7e22ce; }

        .custom-input-group {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
        }
        .custom-input-group input {
            flex: 1;
            padding: 10px;
            border: 2px solid #c084fc;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }
        .custom-input-group button {
            color: white;
            border: none;
            padding: 0 14px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-add { background: #a855f7; }
        .btn-sub { background: #ef4444; }

        .history-list { list-style: none; padding: 0; margin: 8px 0 0 0; }
        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: #faf5ff;
            border: 1px solid #e9d5ff;
            border-radius: 8px;
            margin-bottom: 6px;
            font-size: 0.85rem;
        }
        .toggle-btn {
            width: 100%;
            background: #6b21a8;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-archive {
            width: 100%;
            background: #a855f7;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            margin-top: 6px;
        }
        .period-card {
            background: #faf5ff;
            border: 1px solid #e9d5ff;
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 8px;
            font-size: 0.85rem;
        }
        .period-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        .archive-details {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed #d8b4fe;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            text-align: center;
        }
        .archive-day-box {
            background: white;
            padding: 4px 2px;
            border-radius: 6px;
            font-size: 0.75rem;
            border: 1px solid #f3e8ff;
        }
        .btn-sm {
            background: #a855f7;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        /* ロック切り替えバー */
        .lock-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 8px 14px;
            border-radius: 12px;
            margin-bottom: 12px;
            border: 2px solid #c084fc;
        }
    </style>
</head>
<body>

    <!-- モード切り替えバー -->
    <div class="lock-bar">
        <span id="lock-status" style="font-size:0.85rem; font-weight:bold;">👀 閲覧モード（操作不可）</span>
        <button id="lock-toggle-btn" class="btn-sm" onclick="toggleLock()" style="background:#7e22ce; padding:6px 12px; font-weight:bold;">🔓 編集モードにする</button>
    </div>

    <!-- 1. 加算合計 -->
    <div class="card">
        <h2>🍇 加算合計</h2>
        <div class="total-display">
            <div class="period-title" id="period-label">設定週の合計</div>
            <div class="main-points"><span id="week-pt">0</span> <span style="font-size: 1.1rem;">pt</span></div>
            <div class="sub-points">累計全期間: <span id="total-pt">0</span> pt</div>
        </div>

        <div class="progress-box">
            <div style="display:flex; justify-content:space-between; font-size:0.8rem; font-weight:bold;">
                <span>🎯 目標: <span id="target-pt-val">50,000</span> pt</span>
                <span id="target-percent">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-bar-fill"></div>
            </div>
            <div style="text-align:right; font-size:0.75rem; color:#6b21a8;" id="target-remain-text">
                あと 50,000 pt
            </div>
        </div>
    </div>

    <!-- 2. ポイント加算ボタン -->
    <div class="card">
        <h2>➕ ポイント加算</h2>
        <div class="daily-grid" id="daily-grid"></div>
        <div class="active-target-hint" id="active-target-hint">現在の入力対象日: -</div>

        <div class="btn-grid">
            <button class="btn-pt action-btn" onclick="addPoint(1)">+1 pt</button>
            <button class="btn-pt action-btn" onclick="addPoint(100)">+100 pt</button>
            <button class="btn-pt action-btn" onclick="addPoint(500)">+500 pt</button>
            <button class="btn-pt action-btn" onclick="addPoint(1000)">+1,000 pt</button>
            <button class="btn-pt action-btn" onclick="addPoint(5000)">+5,000 pt</button>
            <button class="btn-pt action-btn" onclick="addPoint(10000)">+10,000 pt</button>
            <button class="btn-pt btn-max action-btn" onclick="addPoint(30000)">+30,000 pt</button>
        </div>

        <div class="custom-input-group">
            <input type="number" id="custom-pt" class="action-btn" placeholder="自由入力 (例: 250)">
            <button class="btn-add action-btn" onclick="addCustomPoint(1)">加算 (+)</button>
            <button class="btn-sub action-btn" onclick="addCustomPoint(-1)">引き算 (-)</button>
        </div>
    </div>

    <!-- 3. ミス消去 / 履歴 -->
    <div class="card">
        <h2>↩️ ミス消去 / 直近の履歴</h2>
        <button class="action-btn" style="width:100%; background:#ef4444; color:white; border:none; padding:8px; border-radius:6px; font-weight:bold; font-size:0.8rem; cursor:pointer;" onclick="undoLast()">直前の操作を1件取り消す</button>
        <ul class="history-list" id="recent-logs"></ul>
    </div>

    <!-- 4. 週の設定とアーカイブ -->
    <div class="card">
        <h2>📅 週の設定 / アーカイブ操作</h2>
        <div class="setting-box">
            <span>開始日:</span>
            <input type="date" id="week-start-input" class="action-btn">
            <button class="btn-sm action-btn" onclick="saveWeekStart()">週を設定</button>
        </div>

        <div class="setting-box">
            <span>目標pt:</span>
            <input type="number" id="target-input" class="action-btn" placeholder="例: 50000">
            <button class="btn-sm action-btn" onclick="saveTargetPoints()">目標保存</button>
        </div>

        <button class="btn-archive action-btn" onclick="archiveCurrentWeek()">📦 この週を確定してアーカイブへ送る</button>
    </div>

    <!-- 5. 過去の記録 -->
    <div class="card">
        <button class="toggle-btn" onclick="togglePastRecords()">過去の全週記録 🍇</button>
        <div id="past-records-container" style="display: none; margin-top: 12px;">
            <div id="past-periods-list"></div>
        </div>
    </div>

    <script>
        const LIVER_PIN = "1115"; // 設定パスワード
        let isEditable = false;    // 初期状態は閲覧専用
        let selectedDate = null;
        let isUserManualSelect = false;

        function updateUIState() {
            const actionElems = document.querySelectorAll('.action-btn');
            const statusText = document.getElementById('lock-status');
            const toggleBtn = document.getElementById('lock-toggle-btn');

            if (isEditable) {
                statusText.innerText = "✏️ 編集モード（操作可能）";
                statusText.style.color = "#16a34a";
                toggleBtn.innerText = "🔒 閲覧モードに戻す";
                toggleBtn.style.background = "#ef4444";
                
                actionElems.forEach(el => {
                    el.disabled = false;
                    el.style.opacity = '1';
                    el.style.cursor = 'pointer';
                });
            } else {
                statusText.innerText = "👀 閲覧モード（操作不可）";
                statusText.style.color = "#6b21a8";
                toggleBtn.innerText = "🔓 編集モードにする";
                toggleBtn.style.background = "#7e22ce";

                actionElems.forEach(el => {
                    el.disabled = true;
                    el.style.opacity = '0.5';
                    el.style.cursor = 'not-allowed';
                });
            }
        }

        function toggleLock() {
            if (isEditable) {
                isEditable = false;
                updateUIState();
            } else {
                const inputPin = prompt("ライバー用パスワードを入力してください:");
                if (inputPin === LIVER_PIN) {
                    isEditable = true;
                    updateUIState();
                } else if (inputPin !== null) {
                    alert("パスワードが違います");
                }
            }
        }

        async function loadSummary() {
            try {
                const res = await fetch('/get_summary');
                const data = await res.json();
                
                document.getElementById('week-start-input').value = data.week_start_date;
                document.getElementById('period-label').innerText = `${data.period_label} の加算分`;
                document.getElementById('week-pt').innerText = (data.week_total || 0).toLocaleString();
                document.getElementById('total-pt').innerText = (data.total_all || 0).toLocaleString();

                const target = data.target_points !== undefined ? data.target_points : 50000;
                const weekTotal = data.week_total || 0;
                document.getElementById('target-input').value = target;
                document.getElementById('target-pt-val').innerText = target.toLocaleString();
                
                let pct = 0;
                if (target === 0) {
                    pct = weekTotal > 0 ? 100 : 0;
                } else {
                    pct = Math.min(100, Math.round((weekTotal / target) * 100));
                }
                if (isNaN(pct)) pct = 0;
                
                document.getElementById('target-percent').innerText = `${pct}%`;
                document.getElementById('progress-bar-fill').style.width = `${pct}%`;

                const remain = target - weekTotal;
                if (target > 0 && remain <= 0) {
                    document.getElementById('target-remain-text').innerText = '🎉 目標達成！おめでとうございます！';
                } else if (target === 0) {
                    document.getElementById('target-remain-text').innerText = '🎯 目標: 0 pt 設定中';
                } else {
                    document.getElementById('target-remain-text').innerText = `あと ${remain.toLocaleString()} pt`;
                }

                if (!isUserManualSelect) {
                    const matchToday = data.daily_breakdown.find(d => d.is_today);
                    if (matchToday) {
                        selectedDate = matchToday.full_date;
                    } else {
                        selectedDate = data.daily_breakdown[0].full_date;
                    }
                }

                const dailyGrid = document.getElementById('daily-grid');
                dailyGrid.innerHTML = '';
                if (data.daily_breakdown) {
                    data.daily_breakdown.forEach(item => {
                        const col = document.createElement('div');
                        const isToday = item.is_today;
                        const isSelected = item.full_date === selectedDate;
                        
                        col.className = `daily-col ${isToday ? 'today' : ''} ${isSelected ? 'selected' : ''}`;
                        col.onclick = () => selectDate(item.full_date);

                        let displayVal = Math.abs(item.total) >= 10000 
                            ? (item.total / 10000).toFixed(1) + '万' 
                            : (item.total || 0).toLocaleString();

                        col.innerHTML = `
                            <div class="daily-date">${item.date_label}</div>
                            <div class="daily-val">${displayVal}</div>
                        `;
                        dailyGrid.appendChild(col);
                    });
                }

                document.getElementById('active-target-hint').innerText = `現在の入力対象日: ${selectedDate}`;

                const recentList = document.getElementById('recent-logs');
                recentList.innerHTML = '';
                if (!data.recent_logs || data.recent_logs.length === 0) {
                    recentList.innerHTML = '<li style="text-align:center; padding:8px; color:#888; font-size:0.8rem;">履歴なし</li>';
                } else {
                    data.recent_logs.forEach(log => {
                        const li = document.createElement('li');
                        li.className = 'history-item';
                        const timePart = log.time.includes(' ') ? log.time.split(' ')[1] : log.time;
                        const sign = log.amount > 0 ? '+' : '';
                        const color = log.amount < 0 ? '#ef4444' : '#4c1d95';
                        
                        li.innerHTML = `
                            <span><strong style="color:${color};">${sign}${log.amount.toLocaleString()} pt</strong> <small style="color:#6b21a8;">(${timePart})</small></span>
                            <span class="action-btn" style="color:#ef4444; cursor:pointer; font-size:0.75rem; font-weight:bold;" onclick="deleteLog(${log.id})">削除 ✕</span>
                        `;
                        recentList.appendChild(li);
                    });
                }

                updateUIState();
            } catch (err) {
                console.error(err);
            }
        }

        function selectDate(fullDate) {
            if (!isEditable) return;
            selectedDate = fullDate;
            isUserManualSelect = true;
            loadSummary();
        }

        async function saveWeekStart() {
            if (!isEditable) return;
            const dateVal = document.getElementById('week-start-input').value;
            if (dateVal) {
                if(confirm('新しい週を開始します。それ以前の記録はアーカイブへ送信されます。よろしいですか？')) {
                    await fetch('/settings/week_start', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ start_date: dateVal })
                    });
                    isUserManualSelect = false;
                    loadSummary();
                }
            }
        }

        async function saveTargetPoints() {
            if (!isEditable) return;
            const targetVal = document.getElementById('target-input').value;
            if (targetVal !== "") {
                await fetch('/settings/target_points', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ target: parseInt(targetVal) })
                });
                loadSummary();
            }
        }

        async function archiveCurrentWeek() {
            if (!isEditable) return;
            if (confirm('現在の週の集計を完了し、過去のアーカイブへ送信して新しい週を開始しますか？')) {
                await fetch('/archive_current_week', { method: 'POST' });
                isUserManualSelect = false;
                loadSummary();
            }
        }

        async function addPoint(amt) {
            if (!isEditable) return;
            await fetch('/add_point', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ amount: amt, target_date: selectedDate })
            });
            loadSummary();
        }

        async function addCustomPoint(sign) {
            if (!isEditable) return;
            const input = document.getElementById('custom-pt');
            const val = parseInt(input.value);
            if (val && val > 0) {
                await addPoint(val * sign);
                input.value = '';
            }
        }

        async function undoLast() {
            if (!isEditable) return;
            const res = await fetch('/undo_last', { method: 'POST' });
            if (res.ok) loadSummary();
        }

        async function deleteLog(id) {
            if (!isEditable) return;
            if (confirm(`この記録を削除しますか？`)) {
                await fetch('/delete_log', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: id })
                });
                loadSummary();
            }
        }

        async function togglePastRecords() {
            const container = document.getElementById('past-records-container');
            if (container.style.display === 'none') {
                container.style.display = 'block';
                await loadArchives();
            } else {
                container.style.display = 'none';
            }
        }

        async function loadArchives() {
            const res = await fetch('/get_past_periods');
            const data = await res.json();
            const listDiv = document.getElementById('past-periods-list');
            listDiv.innerHTML = '';
            if(!data.archives || data.archives.length === 0) {
                listDiv.innerHTML = '<div class="period-card" style="text-align:center; color:#666;">過去のアーカイブはありません</div>';
            } else {
                data.archives.forEach((p) => {
                    let dailyHtml = '';
                    if (p.daily_details && p.daily_details.length > 0) {
                        dailyHtml = '<div class="archive-details">';
                        p.daily_details.forEach(d => {
                            let valStr = Math.abs(d.total) >= 10000 
                                ? (d.total / 10000).toFixed(1) + '万' 
                                : d.total.toLocaleString();
                            dailyHtml += `
                                <div class="archive-day-box">
                                    <div style="color:#6b21a8; font-size:0.68rem;">${d.date_label}</div>
                                    <div style="font-weight:bold;">${valStr}</div>
                                </div>
                            `;
                        });
                        dailyHtml += '</div>';
                    }

                    listDiv.innerHTML += `
                        <div class="period-card">
                            <div class="period-header" onclick="toggleArchiveDetails(${p.id})">
                                <div>
                                    <strong>${p.label}</strong><br>
                                    <span style="color:#7e22ce; font-weight:bold;">${p.total.toLocaleString()} pt</span>
                                </div>
                                <div>
                                    <small style="color:#a855f7;">▼ 明細</small>
                                    <span class="action-btn" style="color:#ef4444; cursor:pointer; font-size:0.8rem; font-weight:bold; margin-left:8px;" onclick="deleteArchive(${p.id}, '${p.label}')">削除 ✕</span>
                                </div>
                            </div>
                            <div id="archive-detail-${p.id}" style="display:none;">
                                ${dailyHtml}
                            </div>
                        </div>
                    `;
                });
            }
            updateUIState();
        }

        function toggleArchiveDetails(id) {
            const target = document.getElementById(`archive-detail-${id}`);
            if (target) {
                target.style.display = target.style.display === 'none' ? 'block' : 'none';
            }
        }

        async function deleteArchive(id, label) {
            if (!isEditable) return;
            if (confirm(`【確認】\n「${label}」のアーカイブ記録を削除しますか？`)) {
                await fetch('/delete_archive', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: id })
                });
                await loadArchives();
            }
        }

        loadSummary();
    </script>
</body>
</html>
